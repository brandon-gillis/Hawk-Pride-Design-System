<style>
body{margin:0}.hp-on-dark .hp-display{color:inherit}a{color:inherit}a:hover{color:var(--gold-700)}.hp-on-dark a:hover{color:var(--gold-400)}
.proto-header .hp-header{position:sticky;top:0;z-index:30}.proto-header{position:sticky;top:0;z-index:30}
@media(max-width:1200px){.proto-header .hp-header__link{padding-left:8px;padding-right:8px;font-size:15px;letter-spacing:.04em}}
@media(max-width:1380px){.proto-header .hp-header__name{display:none}}
.proto-footlink{color:var(--text-inverse-muted);text-decoration:none;min-height:28px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}.proto-footlink:hover{color:var(--gold-400)}
.proto-foottext{color:var(--text-inverse-muted);display:flex;gap:8px;min-height:28px;align-items:center}
.proto-pagehead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;min-height:380px}
.proto-pagehead__img{position:relative;margin-right:calc(-1 * var(--container-pad));min-height:320px}
@media(max-width:860px){.proto-pagehead{grid-template-columns:1fr;gap:0}.proto-pagehead__img{margin:0 calc(-1 * var(--container-pad));min-height:220px}}
.g2,.g3,.g4{display:grid;gap:20px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}.split--wide{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media(max-width:860px){.split,.split--wide{grid-template-columns:1fr;gap:28px}}
.bk-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;align-items:start}
@media(max-width:960px){.bk-layout{grid-template-columns:1fr}.bk-aside{position:static!important}}
.bk-site{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
@media(max-width:1100px){.bk-site{grid-template-columns:1fr}.bk-map{position:static!important}}
.opt{display:flex;gap:16px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface-card);border:2px solid var(--border-subtle);border-radius:var(--radius-md);padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.opt:hover:not(:disabled){border-color:var(--stone-400)}.opt[aria-pressed="true"]{border-color:var(--black-950);box-shadow:inset 0 0 0 1px var(--black-950)}
.opt:disabled{cursor:not-allowed;opacity:.55;background:var(--bg-sunken)}.opt:focus-visible{outline:3px solid var(--focus-ring,#000);outline-offset:2px}
.cal-day{height:44px;border:0;background:none;font:inherit;font-size:15px;cursor:pointer;border-radius:4px;position:relative;color:var(--text-strong)}
.cal-day:disabled{color:var(--stone-400,#aaa);cursor:default}.cal-day:hover:not(:disabled){background:var(--bg-sunken)}
.cal-day[data-in="1"]{background:var(--gold-100,#fff4c2);border-radius:0}.cal-day[data-end="1"]{background:var(--black-950);color:var(--gold-400);border-radius:4px;font-weight:700}
.cal-day[data-ev="1"]::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold-600,#c9a200)}
.map-pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2px solid var(--black-950);font:700 12px/1 var(--font-body);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .12s}
.map-pin[data-state="free"]{background:var(--gold-400);color:var(--black-950)}.map-pin[data-state="taken"]{background:var(--stone-200,#ddd);border-color:var(--stone-400,#aaa);color:var(--stone-500);cursor:default;opacity:.6}
.map-pin[data-state="hl"]{background:var(--black-950);color:var(--gold-400);transform:translate(-50%,-50%) scale(1.25);z-index:2}.map-pin[data-state="sel"]{background:var(--black-950);color:var(--gold-400);box-shadow:0 0 0 4px var(--gold-400);transform:translate(-50%,-50%) scale(1.25);z-index:3}
.unit{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;background:var(--surface-card);border:2px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px;transition:border-color .15s}
.unit[data-hl="1"]{border-color:var(--gold-400)}.unit[data-sel="1"]{border-color:var(--black-950);box-shadow:inset 0 0 0 1px var(--black-950)}
.drawer-scrim{position:fixed;inset:0;background:rgba(13,13,11,.55);z-index:80}.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--surface-card);z-index:81;display:flex;flex-direction:column;box-shadow:var(--shadow-3)}
.proto-conf{}@media(max-width:860px){.proto-conf{grid-template-columns:1fr!important}}
.qr{display:grid;grid-template-columns:repeat(25,1fr);width:100%;aspect-ratio:1;background:#fff}.qr i{display:block}.qr i[data-on="1"]{background:var(--black-950)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
