<!-- @dsCard group="Colors" viewport="700x220" name="Semantic pairings" subtitle="How gold and black combine on light and dark grounds" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}.m{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-family:var(--font-display);font-stretch:var(--fstretch-display);text-transform:uppercase;font-weight:800">
<div style="background:var(--black-950);color:var(--gold-400);padding:16px;border-radius:6px;height:110px;font-size:26px;line-height:1">Gold on<br>black</div>
<div style="background:var(--gold-400);color:var(--black-950);padding:16px;border-radius:6px;height:110px;font-size:26px;line-height:1">Black on<br>gold</div>
<div style="background:var(--stone-50);color:var(--black-950);padding:16px;border-radius:6px;height:110px;font-size:26px;line-height:1;box-shadow:inset 0 0 0 1px var(--border-subtle)">Black on<br>stone</div>
<div style="background:#fff;color:var(--gold-700);padding:16px;border-radius:6px;height:110px;font-size:26px;line-height:1;box-shadow:inset 0 0 0 1px var(--border-subtle)">Gold-700<br>on white</div></div>
<div class="m" style="margin-top:10px;line-height:1.6">Never set gold-400 text on white/stone (fails contrast) — use --gold-700 for gold text on light grounds. Gold fills always carry black text.</div></body></html>
