<!-- @dsCard group="Brand" viewport="760x420" name="Brandmark · misuse" subtitle="Never alter, recolor or crowd the mark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.t{border-radius:6px;height:120px;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--stone-0);box-shadow:inset 0 0 0 1px var(--border-subtle);background-size:cover;background-position:center}.t img{width:66%}
.t::after{content:"✕";position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;background:var(--danger-500);color:var(--stone-0);font:700 12px/20px var(--font-body);text-align:center}
.m{font-size:13px;line-height:1.35;color:var(--text-strong);margin-top:6px}
</style></head><body><div class="g">
<div><div class="t"><img src="../assets/logo/brandmark-gold.svg" style="transform:scaleX(1.45)" alt=""></div><div class="m">Don't stretch or squash</div></div>
<div><div class="t"><img src="../assets/logo/brandmark-gold.svg" style="transform:rotate(-14deg)" alt=""></div><div class="m">Don't rotate</div></div>
<div><div class="t"><img src="../assets/logo/brandmark-gold.svg" style="filter:hue-rotate(160deg) saturate(1.4)" alt=""></div><div class="m">Don't recolor</div></div>
<div><div class="t"><img src="../assets/logo/brandmark-gold.svg" style="filter:drop-shadow(6px 6px 4px rgba(0,0,0,.55))" alt=""></div><div class="m">No shadows, glows or bevels</div></div>
<div><div class="t" style="background:var(--gold-400)"><img src="../assets/logo/brandmark-gold.svg" alt=""></div><div class="m">No gold mark on gold</div></div>
<div><div class="t" style="background-image:url(../assets/photos/event-crawl-crowd.jpg)"><img src="../assets/logo/brandmark-gold.svg" alt=""></div><div class="m">No busy photo without overlay</div></div>
<div><div class="t"><img src="../assets/logo/brandmark-gold.svg" style="opacity:.4" alt=""></div><div class="m">Don't fade or tint</div></div>
<div><div class="t" style="grid-template-rows:auto auto;gap:2px;align-content:center"><img src="../assets/logo/brandmark-gold.svg" style="width:54%;justify-self:center" alt=""><span style="font:800 16px/1 var(--font-display);font-stretch:var(--fstretch-display);text-transform:uppercase;color:var(--black-950)">Hawk Pride Offroad</span></div><div class="m">Don't build your own lockup</div></div>
</div></body></html>
