<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.t{border-radius:6px;height:130px;display:grid;place-items:center;position:relative;overflow:hidden;background-size:cover;background-position:center}.t img{width:66%;position:relative}
.m{font:500 11px/1.35 var(--font-mono);color:var(--text-muted);margin-top:6px}.m b{color:var(--text-strong);font-weight:600}
</style></head><body><div class="g">
<div><div class="t" style="background-color:var(--stone-0);box-shadow:inset 0 0 0 1px var(--border-subtle)"><img src="../assets/logo/brandmark-gold.svg" alt=""></div><div class="m"><b>Gold</b> · white, stone-50/100</div></div>
<div><div class="t" style="background:var(--black-950)"><img src="../assets/logo/brandmark-gold.svg" alt=""></div><div class="m"><b>Gold</b> · black-950/900 (preferred)</div></div>
<div><div class="t" style="background:var(--gold-400)"><img src="../assets/logo/brandmark-black.svg" alt=""></div><div class="m"><b>Black</b> · on gold-400 only</div></div>
<div><div class="t" style="background-image:linear-gradient(rgba(13,13,11,.62),rgba(13,13,11,.62)),url(../assets/photos/rock-ledge-buggies.jpg)"><img src="../assets/logo/brandmark-gold.svg" alt=""></div><div class="m"><b>Gold</b> · photo + 60% black overlay</div></div>
<div><div class="t" style="background:var(--black-950)"><img src="../assets/logo/brandmark-white.svg" alt=""></div><div class="m"><b>White</b> · one-color dark (embroidery, etch, video)</div></div>
<div><div class="t" style="background-color:var(--stone-0);box-shadow:inset 0 0 0 1px var(--border-subtle)"><img src="../assets/logo/brandmark-black.svg" alt=""></div><div class="m"><b>Black</b> · one-color light (fax, stamp, receipts)</div></div>
</div></body></html>
