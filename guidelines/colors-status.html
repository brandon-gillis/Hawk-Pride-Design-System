<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}.m{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px"><div><div style="height:84px;border-radius:4px;background:var(--success-500);"></div><div style="font:600 13px var(--font-body);margin-top:6px;color:var(--text-strong)">Success</div><div class="m">--success-500<br>#2B7541</div></div><div><div style="height:84px;border-radius:4px;background:var(--warning-500);"></div><div style="font:600 13px var(--font-body);margin-top:6px;color:var(--text-strong)">Warning</div><div class="m">--warning-500<br>#946100</div></div><div><div style="height:84px;border-radius:4px;background:var(--danger-500);"></div><div style="font:600 13px var(--font-body);margin-top:6px;color:var(--text-strong)">Danger</div><div class="m">--danger-500<br>#C0281E</div></div><div><div style="height:84px;border-radius:4px;background:var(--info-500);"></div><div style="font:600 13px var(--font-body);margin-top:6px;color:var(--text-strong)">Info</div><div class="m">--info-500<br>#2A6A8A</div></div><div><div style="height:84px;border-radius:4px;background:var(--dirt-300);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)"></div><div style="font:600 13px var(--font-body);margin-top:6px;color:var(--text-strong)">Dirt 300</div><div class="m">--dirt-300<br>#C9A66B</div></div><div><div style="height:84px;border-radius:4px;background:var(--dirt-500);"></div><div style="font:600 13px var(--font-body);margin-top:6px;color:var(--text-strong)">Dirt 500</div><div class="m">--dirt-500<br>#8C6A3A</div></div><div><div style="height:84px;border-radius:4px;background:var(--dirt-700);"></div><div style="font:600 13px var(--font-body);margin-top:6px;color:var(--text-strong)">Dirt 700</div><div class="m">--dirt-700<br>#5A4222</div></div></div></body></html>
