<!-- @dsCard group="Brand" viewport="760x330" name="Brandmark · clear space & size" subtitle="X = ¼ mark height on all sides; 96px / 1in minimum" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
h3{margin:0 0 10px;font:700 13px var(--font-display);font-stretch:var(--fstretch-display);letter-spacing:.14em;text-transform:uppercase;color:var(--text-strong)}
.g{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px}p{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--text-muted)}
.cs{background:var(--stone-0);border:1px solid var(--border-subtle);border-radius:6px;height:230px;display:grid;place-items:center}
.box{--x:26px;position:relative;padding:var(--x);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(192,40,30,.10) 6px 7px);outline:1px dashed var(--danger-500)}
.box img{display:block;width:204px;outline:1px solid rgba(192,40,30,.35)}
.x{position:absolute;font:700 11px var(--font-mono);color:var(--danger-500);display:grid;place-items:center}.x.t{top:0;left:0;right:0;height:var(--x)}.x.l{top:0;bottom:0;left:0;width:var(--x)}
.sz{display:grid;gap:10px}.row{display:flex;align-items:flex-end;gap:16px;background:var(--stone-0);border:1px solid var(--border-subtle);border-radius:6px;padding:14px}
.row div{display:grid;gap:6px;justify-items:start}.m{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}.bad{color:var(--danger-500)}
</style></head><body><div class="g">
<div><h3>Clear space</h3><div class="cs"><div class="box"><span class="x t">X</span><span class="x l">X</span><img src="../assets/logo/brandmark-gold.svg" alt="Brandmark"></div></div><p>X = one quarter of the mark's height. Keep text, edges and other graphics outside this zone.</p></div>
<div><h3>Minimum size</h3><div class="sz">
<div class="row"><div><img src="../assets/logo/brandmark-gold.svg" style="width:96px" alt=""><span class="m">96px wide · digital</span></div><div><img src="../assets/logo/brandmark-gold.svg" style="width:72px" alt=""><span class="m">1in / 25mm · print</span></div></div>
<div class="row"><div><img src="../assets/logo/brandmark-gold.svg" style="width:40px" alt=""><span class="m bad">40px · too small</span></div></div>
</div><p>Below the minimum the hawk disappears. Use the small-size mark for favicons, avatars and app icons.</p></div>
</div></body></html>
