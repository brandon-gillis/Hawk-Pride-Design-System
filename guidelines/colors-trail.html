<!-- @dsCard group="Colors" viewport="700x130" name="Trail difficulty" subtitle="Shape + color, following trail-sign convention" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--bg-page);font-family:var(--font-body);color:var(--text-body)}.m{font:500 11px/1.3 var(--font-mono);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="background:#fff;border:1px solid var(--border-subtle);border-radius:6px;padding:14px"><span class="hp-diff"><span class="hp-diff__mark hp-diff__mark--easy"></span>Easy</span><div class="m" style="margin-top:10px">--trail-easy</div></div><div style="background:#fff;border:1px solid var(--border-subtle);border-radius:6px;padding:14px"><span class="hp-diff"><span class="hp-diff__mark hp-diff__mark--moderate"></span>Moderate</span><div class="m" style="margin-top:10px">--trail-moderate</div></div><div style="background:#fff;border:1px solid var(--border-subtle);border-radius:6px;padding:14px"><span class="hp-diff"><span class="hp-diff__mark hp-diff__mark--difficult"></span>Difficult</span><div class="m" style="margin-top:10px">--trail-difficult</div></div><div style="background:#fff;border:1px solid var(--border-subtle);border-radius:6px;padding:14px"><span class="hp-diff"><span class="hp-diff__mark hp-diff__mark--extreme"></span>Extreme</span><div class="m" style="margin-top:10px">--trail-extreme</div></div></div></body></html>
