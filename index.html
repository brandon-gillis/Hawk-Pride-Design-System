<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:var(--font-body);color:var(--black-950);background:var(--stone-50)}a{color:inherit}a:hover{color:var(--gold-700)}

.app{display:grid;grid-template-columns:288px minmax(0,1fr);height:100vh}

.search input::placeholder{color:#8f8b80}.search input:focus{outline:2px solid var(--gold-400);outline-offset:1px;border-color:transparent}
.search svg{position:absolute;left:10px;top:11px;opacity:.6}.search kbd{position:absolute;right:8px;top:9px;font:12px var(--font-mono);color:#8f8b80;border:1px solid rgba(255,255,255,.18);border-radius:3px;padding:1px 6px}

.tok:first-of-type{border-top:1px solid var(--border-subtle,#e4e1da);border-radius:6px 6px 0 0}.tok:last-child{border-radius:0 0 6px 6px}

.sw{width:44px;height:32px;border-radius:4px;border:1px solid rgba(13,13,11,.12)}.sw--txt{display:grid;place-items:center;font-size:11px;color:var(--text-muted);background:var(--stone-50);border-style:dashed}
.copy{border:1px solid var(--border-default,#cfcac0);background:#fff;border-radius:4px;font:inherit;font-size:12px;font-weight:600;padding:5px 10px;cursor:pointer}.copy:hover{border-color:var(--black-950)}

.mbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--black-950);color:var(--stone-50);position:sticky;top:0;z-index:40}.mbar button{background:none;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:4px;height:36px;padding:0 12px;font:inherit;cursor:pointer}.mbar img{height:32px}
.head,.body,.canvas,.hero{padding-left:20px;padding-right:20px}.hero{grid-template-columns:1fr}.tok{grid-template-columns:44px minmax(0,1fr) auto}.tok .v{display:none}}

"path":"guidelines/colors-pairings.html","group":"Colors","w":760,"h":470,"name":"Approved pairings","sub":"The only text/surface combinations to use, plus common failures","id":"approved-pairings"},{"path":"guidelines/colors-contrast.html","group":"Colors","w":760,"h":740,"name":"Contrast matrix","sub":"WCAG ratios for every text color on every surface, computed live from tokens","id":"contrast-matrix"},{"path":"guidelines/type-display.html","group":"Type","w":700,"h":250,"name":"Display","sub":"Archivo Condensed 800, uppercase — headlines and prices","id":"display"},{"path":"guidelines/type-body.html","group":"Type","w":700,"h":260,"name":"Body","sub":"Archivo 400–600 for reading text and UI","id":"body"},{"path":"guidelines/type-mono.html","group":"Type","w":700,"h":130,"name":"Mono","sub":"IBM Plex Mono for trail numbers, confirmation codes, coordinates","id":"mono"},{"path":"guidelines/type-scale.html","group":"Type","w":760,"h":960,"name":"Type scale","sub":"Final ladder: size (mobile → desktop), line-height, tracking, weight","id":"type-scale"},{"path":"guidelines/spacing.html","group":"Spacing","w":700,"h":170,"name":"Spacing scale","sub":"4px base","id":"spacing-scale"},{"path":"guidelines/radii.html","group":"Spacing","w":700,"h":150,"name":"Radii","sub":"Tight, sign-like corners","id":"radii"},{"path":"guidelines/shadows.html","group":"Spacing","w":700,"h":160,"name":"Elevation","sub":"Soft warm-black shadows; hairline borders do most of the work","id":"elevation"},{"path":"guidelines/buttons-in-use.html","group":"Spacing","w":700,"h":200,"name":"Spacing in use","sub":"Card padding 16/18, gaps 8–14, 44px touch targets","id":"spacing-in-use"},{"path":"components/content/content.card.html","group":"Components","w":700,"h":400,"name":"Content","sub":"Card, Photo, EventCard, LodgingCard, PriceCard, TrailRow","id":"content"},{"path":"components/core/core.card.html","group":"Components","w":700,"h":330,"name":"Core","sub":"Button, IconButton, Badge, DifficultyBadge, Icon","id":"core"},{"path":"components/feedback/feedback.card.html","group":"Components","w":700,"h":400,"name":"Feedback","sub":"Alert, Dialog, Toast, Tooltip","id":"feedback"},{"path":"components/forms/forms.card.html","group":"Components","w":700,"h":400,"name":"Forms","sub":"Input, Select, Checkbox, Radio, Switch, QuantityStepper","id":"forms"},{"path":"components/navigation/navigation.card.html","group":"Components","w":700,"h":330,"name":"Navigation","sub":"SiteHeader, Tabs, BookingBar","id":"navigation"},{"path":"guidelines/components-states.html","group":"Components","w":760,"h":1100,"name":"States & accessibility","sub":"Focus, disabled, error, on-dark, hit areas — the QA baseline every component meets","id":"states-and-accessibility"},{"path":"ui_kits/website-prototype/index.html","group":"Website","w":1440,"h":900,"name":"Website prototype","sub":"Click-through demo: booking, checkout, waivers, gate check-in","app":true,"id":"website-prototype"},{"path":"ui_kits/website/index.html","group":"Website","w":1280,"h":800,"name":"Website UI kit","sub":"Screens built from the components","app":true,"id":"website-ui-kit"},{"path":"ui_kits/website/mobile.html","group":"Website","w":390,"h":844,"name":"Mobile screens","sub":"Phone layouts of the public site","app":true,"id":"mobile-screens"}],"tokenFiles":["colors.css","effects.css","fonts.css","spacing.css","typography.css"]};

function renderNav(route){const q=$('#q').value.trim().toLowerCase();const m=p=>!q||(p.name+' '+p.sub+' '+p.group).toLowerCase().includes(q);let h='';

function page(p){const i=P.indexOf(p),prev=P[i-1],next=P[i+1];
 const acts='<div class="seg" role="group" aria-label="Zoom"><button data-z="fit" aria-pressed="'+(zoom==='fit')+'">Fit</button><button data-z="100" aria-pressed="'+(zoom==='100')+'">100%</button></div><button class="btn" id="cplink">Copy link</button><a class="btn" href="'+esc(p.path)+'" target="_blank" rel="noopener">Open ↗</a>';
 return head('<a href="#/">Overview</a><span>/</span><a href="#/g/'+gid(p.group)+'">'+p.group+'</a>',p.name,p.sub,acts)+
 '<div class="canvas"><div class="frame-label" id="flabel"><span>'+esc(p.name)+'</span><span>'+p.w+' × '+p.h+'</span></div><div class="frame" id="frame"><iframe id="pf" title="'+esc(p.name)+'" src="'+esc(p.path)+'" width="'+p.w+'" height="'+p.h+'"></iframe></div>'+
 '<div class="pager">'+(prev?'<a href="#/p/'+prev.id+'"><small>← Previous · '+prev.group+'</small><b>'+esc(prev.name)+'</b></a>':'')+(next?'<a class="next" href="#/p/'+next.id+'"><small>Next · '+next.group+' →</small><b>'+esc(next.name)+'</b></a>':'')+'</div></div>'}
function fitFrame(p){const f=$('#pf'),fr=$('#frame'),lab=$('#flabel');if(!f)return;const avail=$('.canvas').clientWidth-parseFloat(getComputedStyle($('.canvas')).paddingLeft)*2;
 const s=zoom==='fit'?Math.min(1,avail/p.w):1;let h=p.h;if(!p.app){try{const d=f.contentDocument;if(d&&d.documentElement)h=Math.max(p.h,d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0)}catch(e){}}
 f.height=h;f.style.transform='scale('+s+')';fr.style.width=(p.w*s)+'px';fr.style.height=(h*s)+'px';lab.style.width=(p.w*s)+'px';lab.lastChild.textContent=p.w+' × '+(p.app?p.h:h)+(s<1?' · '+Math.round(s*100)+'%':'');
 fr.style.overflow=zoom==='fit'?'hidden':'visible'; $('.canvas').style.overflowX=zoom==='fit'?'visible':'auto'}
let tokCache=null;
async function tokens(){const box=$('#view');box.innerHTML=head('<a href="#/">Overview</a><span>/</span><span>Tokens</span>','Tokens','Every CSS custom property in the system. Click Copy to grab the var() for code.')+'<div class="body" id="tokbody"><p style="color:var(--text-muted)">Loading tokens…</p></div>';
 try{if(!tokCache){tokCache=[];for(const f of DATA.tokenFiles){const t=await (await fetch('tokens/'+f)).text();const list=[...t.replace(/\/\*[\s\S]*?\*\//g,'').matchAll(/(--[a-z0-9-]+)\s*:\s*([^;]+);/gi)].map(m=>({n:m[1],raw:m[2].trim()}));const seen=new Set();tokCache.push({file:f,list:list.filter(x=>!seen.has(x.n)&&seen.add(x.n))})}}
  const cs=getComputedStyle(document.documentElement);const isColor=v=>/^(#|rgb|hsl|oklch|oklab|color\()/i.test(v);
  const title=f=>f.replace('.css','').replace(/^./,c=>c.toUpperCase());
  $('#tokbody').innerHTML=tokCache.filter(g=>g.list.length).map(g=>'<section class="tok-g"><div class="sec-h"><h2 class="disp">'+title(g.file)+'</h2><span style="color:var(--text-muted);font-size:14px">'+g.list.length+' tokens · tokens/'+g.file+'</span></div><div>'+g.list.map(x=>{const v=cs.getPropertyValue(x.n).trim()||x.raw;const col=isColor(v);
   return '<div class="tok">'+(col?'<span class="sw" style="background:'+esc(v)+'"></span>':'<span class="sw sw--txt">Aa</span>')+'<code>'+x.n+'</code><span class="v" title="'+esc(x.raw)+'">'+esc(x.raw===v?v:x.raw+'  →  '+v)+'</span><button class="copy" data-copy="var('+x.n+')">Copy</button></div>'}).join('')+'</div></section>').join('');
 }catch(e){$('#tokbody').innerHTML='<p>Tokens load when the site is served from a web address (not opened as a local file). See <a href="styles.css">styles.css</a>.</p>'}}
function render(){const r=parse();renderNav(r);$('#side').classList.remove('open');$('#main').scrollTop=0;const v=$('#view');
 document.title=(r.v==='page'?r.p.name+' · ':r.v==='group'?r.g+' · ':r.v==='tokens'?'Tokens · ':'')+'Hawk Pride Design System';
 if(r.v==='tokens'){tokens();return}
 v.innerHTML=r.v==='page'?page(r.p):r.v==='group'?group(r.g):home();
 if(r.v==='page'){const f=$('#pf');const go=()=>fitFrame(r.p);f.addEventListener('load',()=>{go();setTimeout(go,400);setTimeout(go,1500)});go();
  v.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{zoom=b.dataset.z;localStorage.setItem('hpds-zoom',zoom);v.querySelectorAll('[data-z]').forEach(x=>x.setAttribute('aria-pressed',x===b));go()});
  $('#cplink').onclick=()=>copy(location.href,'Link copied')} else mountThumbs()}
document.addEventListener('click',e=>{const c=e.target.closest('[data-copy]');if(c)copy(c.dataset.copy,'Copied '+c.dataset.copy)});
$('#q').addEventListener('input',()=>renderNav(parse()));
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$('#nav a[href^="#/p/"]');if(a){location.hash=a.getAttribute('href');$('#q').value='';$('#q').blur()}}if(e.key==='Escape'){$('#q').value='';renderNav(parse());$('#q').blur()}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#q')){e.preventDefault();$('#q').focus()}});
$('#menu').onclick=()=>$('#side').classList.add('open');
addEventListener('hashchange',render);addEventListener('resize',()=>{const r=parse();if(r.v==='page')fitFrame(r.p);else rescaleThumbs()});
render();
</script></body></html>
